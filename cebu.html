    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
      :root { --ink:#454b73; --violet:#6267a9; --line:rgba(255,255,255,.7); }
      * { box-sizing:border-box; }
      body { position:relative; overflow-x:hidden; margin:0; background:radial-gradient(circle at 89% 4%,rgba(241,238,255,.9),transparent 27rem),radial-gradient(circle at 7% 70%,rgba(179,221,244,.55),transparent 30rem),linear-gradient(145deg,#c7cee9,#b8c2e2); color:var(--ink); font-family:"Noto Sans TC",sans-serif; }
      body:before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.34; background-image:linear-gradient(rgba(255,255,255,.19) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px); background-size:34px 34px; }
      .atmosphere { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
      .glow { position:absolute; border-radius:50%; filter:blur(10px); mix-blend-mode:screen; }
      .glow--one { top:10%; left:-100px; width:330px; height:330px; background:radial-gradient(circle,rgba(233,226,255,.86),transparent 68%); animation:drift-one 15s ease-in-out infinite alternate; }
      .glow--two { right:-150px; bottom:8%; width:410px; height:410px; background:radial-gradient(circle,rgba(174,220,247,.76),transparent 68%); animation:drift-two 18s ease-in-out infinite alternate; }
      .star { position:absolute; left:var(--x); top:var(--y); color:#fff; font:var(--size)/1 serif; opacity:.3; text-shadow:0 0 15px rgba(255,255,255,.95),0 0 26px rgba(174,201,244,.9); animation:twinkle var(--duration) ease-in-out var(--delay) infinite; }
      @keyframes drift-one { to { transform:translate(80px,55px) scale(1.14); } }
      @keyframes drift-two { to { transform:translate(-76px,-58px) scale(.9); } }
      @keyframes twinkle { 0%,100% { opacity:.12; transform:scale(.72); } 50% { opacity:.76; transform:translateY(-11px) scale(1.14); } }
      .page { position:relative; z-index:1; max-width:1060px; margin:auto; padding:56px 34px; }
      .back { display:inline-flex; padding:7px 11px; color:#5963a1; border:1px solid rgba(255,255,255,.72); border-radius:999px; background:rgba(244,246,255,.56); font:12px "DM Mono",monospace; text-decoration:none; backdrop-filter:blur(9px); }
      .hero { margin:22px 0 28px; padding:32px; border:1px solid var(--line); border-radius:5px 24px 5px 24px; background:linear-gradient(135deg,rgba(249,250,255,.76),rgba(225,230,248,.56)); box-shadow:12px 16px 32px rgba(72,81,135,.13),inset 0 1px 0 rgba(255,255,255,.76); backdrop-filter:blur(15px) saturate(112%); }
      .eyebrow { margin:0 0 10px; color:var(--violet); font:11px "DM Mono",monospace; letter-spacing:.14em; }
      .hero h1 { margin:0; color:#605a9d; font-size:38px; text-shadow:0 1px 0 rgba(255,255,255,.58); }
      .hero .meta { margin:10px 0 0; color:#68729b; }
      .summary { max-width:760px; margin:18px 0 0; padding-top:18px; border-top:1px solid rgba(255,255,255,.6); color:#59628f; font-size:14px; line-height:1.8; }
      .grid { column-count:3; column-gap:12px; }
      .card { position:relative; break-inside:avoid; margin:0 0 12px; }
      .card img { display:block; width:100%; height:auto; border:1px solid rgba(255,255,255,.55); border-radius:10px; box-shadow:0 9px 22px rgba(65,80,133,.13); }
      .card figcaption { position:absolute; left:8px; bottom:7px; padding:3px 7px; color:#fff; border:1px solid rgba(255,255,255,.32); border-radius:4px; background:rgba(77,81,139,.58); font:10px "DM Mono",monospace; text-shadow:0 1px 5px rgba(43,47,90,.8); backdrop-filter:blur(5px); }
      @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
      @media (max-width:700px) { .page { padding:28px 17px; } .hero { padding:24px; } .grid { column-count:2; } }
    </style>
  </head>

        <p class="summary">於 IMS Academy Cebu 進行一個月全英文沉浸式學習。透過與不同國籍、年齡層同學的交流，提升英文溝通與跨文化適應能力；完善的教學與生活支援，也讓我能專注於學習與探索在地生活。</p>
